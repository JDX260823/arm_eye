<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>arm_eye 摄像头</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #10141b; color: #eef2f7; display: grid; place-items: center; }
    main { width: min(960px, 94vw); padding: 24px 0 36px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .status { color: #aeb9c8; margin: 0 0 18px; }
    .stage { background: #05070a; border: 1px solid #2b3544; border-radius: 14px; overflow: hidden; box-shadow: 0 16px 40px #0006; }
    video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transform: scaleX(-1); background: #000; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 16px; background: #18202b; font-size: 14px; }
    button { border: 0; border-radius: 8px; padding: 9px 14px; color: #fff; background: #2878d8; cursor: pointer; font-size: 14px; }
    button:hover { background: #3b8bea; }
    code { color: #9ed0ff; }
  </style>
</head>
<body>
  <main>
    <h1>arm_eye 摄像头画面</h1>
    <p id="status" class="status">正在请求摄像头权限…</p>
    <section class="stage">
      <video id="camera" autoplay playsinline muted></video>
      <div class="bar">
        <button id="start" type="button">重新开启摄像头</button>
        <span>设备：<code id="device">未选择</code></span>
        <span>分辨率：<code id="resolution">-</code></span>
      </div>
    </section>
  </main>
  <script>
    const video = document.getElementById('camera');
    const status = document.getElementById('status');
    const deviceText = document.getElementById('device');
    const resolutionText = document.getElementById('resolution');
    let stream;

    function stopStream() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
    }

    function isMacBookCamera(label) {
      return /macbook|built[- ]?in|内置/i.test(label || '');
    }

    async function openCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('当前浏览器不支持摄像头 API');
      }
      stopStream();
      status.textContent = '正在请求摄像头权限…';

      // 先授权并读取设备标签；授权后优先切换到 MacBook 内置摄像头。
      let initial = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      let cameras = (await navigator.mediaDevices.enumerateDevices())
        .filter(item => item.kind === 'videoinput');
      const preferred = cameras.find(item => isMacBookCamera(item.label));
      const initialId = initial.getVideoTracks()[0].getSettings().deviceId;
      if (preferred && preferred.deviceId && preferred.deviceId !== initialId) {
        initial.getTracks().forEach(track => track.stop());
        initial = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: preferred.deviceId } }, audio: false
        });
      }

      stream = initial;
      video.srcObject = stream;
      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings();
      const selected = cameras.find(item => item.deviceId === settings.deviceId);
      deviceText.textContent = selected?.label || track.label || '默认摄像头';
      resolutionText.textContent = `${settings.width || '-'} × ${settings.height || '-'}`;
      status.textContent = '摄像头已开启，画面来自电脑本机。';
    }

    async function start() {
      try { await openCamera(); }
      catch (error) {
        status.textContent = `摄像头开启失败：${error.message}`;
        deviceText.textContent = '无';
        resolutionText.textContent = '-';
      }
    }

    document.getElementById('start').addEventListener('click', start);
    window.addEventListener('beforeunload', stopStream);
    start();
  </script>
</body>
</html>
